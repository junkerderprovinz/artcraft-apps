# Pushes the README and short description to every app's Docker Hub repo
# without a build, to tell a broken credential apart from a broken build.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read apps.json
        id: read
        run: echo "list=$(jq -c . apps.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.list) }}
    name: sync (${{ matrix.app.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app.app }}
          short-description: "${{ matrix.app.title }} for Unraid, in your browser via Selkies: ${{ matrix.app.kind }}."
          enable-url-completion: true

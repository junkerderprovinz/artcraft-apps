name: Build & Push

# Builds every app in apps.json natively per platform, boots each image as a
# smoke gate, pushes by digest and assembles one multi-arch manifest per app on
# GHCR. Docker Hub joins once the DOCKERHUB_USERNAME variable and the
# DOCKERHUB_TOKEN secret are both set. Release branches build and smoke-test
# without pushing.

on:
  push:
    branches: [ main, 'rel/**' ]
    tags: [ 'v*.*.*' ]
    # Every build covers all 13 apps on two architectures, so only changes
    # that reach the image start one. Tag pushes ignore this filter.
    paths:
      - 'Dockerfile'
      - 'apps.json'
      - 'rootfs/**'
      - '.github/assets/banner-raw.txt'
      - '.github/assets/icons/**'
      - '.github/workflows/build.yml'
  # Weekly and on demand, the newest release is rebuilt without the layer cache
  # to pick up the Selkies base and Ubuntu's security updates.
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Merging several pull requests in a row builds only the last of them. A
# rebuild of the newest release runs apart from pushes, so neither cancels the
# other.
concurrency:
  group: build-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'rebuild' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Rebuilds refresh the newest release, which is what people run, not the
  # tip of main.
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "rebuilding $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  apps:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Read apps.json
        id: read
        run: echo "list=$(jq -c . apps.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: [ release, apps ]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.list) }}
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.app.app }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      APP: ${{ matrix.app.app }}
      PUBLISH: ${{ github.ref_type == 'tag' || github.ref_name == 'main' || needs.release.outputs.tag != '' }}

    steps:
      # The image is about 3 GB and Trivy exports it once more to scan it, which
      # outgrows the free space a hosted runner starts with.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app.app }}

      - name: Build ${{ matrix.arch }} image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP=${{ matrix.app.app }}
            APP_TITLE=${{ matrix.app.title }}
            APP_VERSION=${{ matrix.app.version }}
          push: false
          load: true
          tags: ${{ matrix.app.app }}:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.app.app }}-${{ matrix.arch }}
          no-cache: ${{ needs.release.outputs.tag != '' }}

      # Nothing is pushed unless the WebUI answers and the app is still running
      # once the session is up. A crash at launch would leave the WebUI serving
      # an empty desktop, so the port alone proves little.
      - name: "Smoke test ${{ matrix.arch }}: must serve the WebUI and keep the app running"
        run: |
          set -euo pipefail
          img="$APP:smoke-${{ matrix.arch }}"
          docker run --rm --entrypoint test "$img" -x "/usr/bin/$APP" \
            || { echo "❌ /usr/bin/$APP missing, the package did not install"; exit 1; }
          name=craft-smoke
          docker run -d --name "$name" --shm-size=1g -p 3001:3001 "$img"
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker logs "$name" 2>&1 | grep -q "IS READY"; then
              sleep 10
              if docker exec "$name" pgrep -x "$APP" >/dev/null; then
                echo "✅ WebUI ready and $APP running after ${SECONDS}s"
                docker rm -f "$name" >/dev/null
                exit 0
              fi
              echo "❌ $APP is not running after the WebUI came up, logs:"
              docker logs "$name" || true
              docker exec "$name" sh -c "tail -40 /config/.config/$APP/logs/*.log" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early, logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 2
          done
          echo "❌ not ready within 180s, logs:"
          docker logs "$name" || true
          docker rm -f "$name" >/dev/null
          exit 1

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.app.app }}:smoke-${{ matrix.arch }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Code scanning on a private repository needs GitHub Advanced Security.
      - name: Upload Trivy results to the Security tab
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.app.app }}-${{ matrix.arch }}

      - name: Push ${{ matrix.arch }} by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP=${{ matrix.app.app }}
            APP_TITLE=${{ matrix.app.title }}
            APP_VERSION=${{ matrix.app.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.app.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.app }}-${{ matrix.arch }}
          no-cache: ${{ needs.release.outputs.tag != '' }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.app.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [ release, apps, build ]
    if: ${{ !failure() && !cancelled() && (github.ref_type == 'tag' || github.ref_name == 'main' || needs.release.outputs.tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.list) }}
    name: merge (${{ matrix.app.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app.app }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves only for a tag build, and only when that tag is the highest
      # version in the repo: the first keeps an unreleased merge to main away from
      # everyone who pulls `latest`, the second keeps a re-cut of an older tag from
      # dragging `latest` backwards. This job needs the checkout for the tags alone.
      - name: Checkout (tags for the newest-release check)
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
          fi

      # The repo version and the app version count independently, so a release
      # tags each image with both, as <app version>-r<repo version>, and the app
      # version alone. A rebuild of the newest release sets the same tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app.app }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app.app }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern=${{ matrix.app.version }}-r{{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=${{ matrix.app.version }},enable=${{ (github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true') || needs.release.outputs.tag != '' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' && needs.release.outputs.tag == '' }}
            type=raw,value=latest,enable=${{ (github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true') || needs.release.outputs.tag != '' }}
            type=sha,format=short,enable=${{ needs.release.outputs.tag == '' }}

      - name: Create multi-arch manifests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/${{ matrix.app.app }}"
          sources=""
          for d in *; do sources="$sources ${src}@sha256:${d}"; done
          tagargs=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tagargs="$tagargs -t $tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "tags:${tagargs}"
          # Cross-registry copy (GHCR -> Docker Hub) can hit a transient HTTP/2
          # PROTOCOL_ERROR on large layers; retry a few times before failing.
          n=0
          until docker buildx imagetools create ${tagargs} ${sources}; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then echo "imagetools create failed after $n attempts"; exit 1; fi
            echo "imagetools create failed (attempt $n); retrying in $((n * 15))s..."
            sleep $((n * 15))
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.app.app }}:${{ steps.meta.outputs.version }}

      # The images are already pushed by now, so a token without edit rights on
      # the description must not turn the release red.
      - name: Sync README to Docker Hub
        if: ${{ steps.newest.outputs.is_newest == 'true' && vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app.app }}
          short-description: "${{ matrix.app.title }} for Unraid, in your browser via Selkies: ${{ matrix.app.kind }}."
          enable-url-completion: true
